services:
  postgres:
    image: postgres:16-alpine
    container_name: valorank-db
    restart: always
    environment:
      POSTGRES_DB: valorank
      POSTGRES_USER: valorank_user
      POSTGRES_PASSWORD: valorank_pass
    ports:
      - "5432:5432"
    volumes:
      - valorank_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valorank_user -d valorank"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: valorank-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/valorank
      SPRING_DATASOURCE_USERNAME: valorank_user
      SPRING_DATASOURCE_PASSWORD: valorank_pass
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:4200,https://d3shmjwrm20rbc.cloudfront.net"
      HENRIKDEV_API_KEY: ${HENRIKDEV_API_KEY:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-}

volumes:
  valorank_data:
    driver: local
